name: Deploy Python Backend to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: acrevangelista7990.azurecr.io
  CONTAINER_APP_NAME: app-evangelista-backend
  RESOURCE_GROUP: rg-evangelista-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Log in to Azure
        run: |
          az login -u "${{ secrets.AZURE_USERNAME }}" -p "${{ secrets.AZURE_PASSWORD }}" --tenant "3ae3c7c7-ea51-46de-9540-12f4110eac9b"

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        working-directory: Backend
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:latest .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:latest

      # ponytail: align to use Groq provider and secure port 443 for Qdrant
      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
          containerAppEnvironment: cae-evangelista
          ingress: external
          targetPort: 8000
          arguments: |
            --env-vars LLM_PROVIDER=groq LLM_MODEL=groq-llama-70b GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" DATABASE_URL="${{ secrets.DATABASE_URL }}" ASYNC_DATABASE_URL="${{ secrets.ASYNC_DATABASE_URL }}" QDRANT_MODE=server QDRANT_HOST=app-evangelista-qdrant.internal.jollyflower-774ba306.eastus2.azurecontainerapps.io QDRANT_PORT=443
