name: Deploy Python Backend to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: acrevangelista7990.azurecr.io
  CONTAINER_APP_NAME: app-evangelista-backend
  RESOURCE_GROUP: rg-evangelista-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          token: ${{ secrets.GH_PAT }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_USERNAME }}","clientSecret":"${{ secrets.AZURE_PASSWORD }}","subscriptionId":"0e945b3a-107c-4a83-8efc-824ca6538551","tenantId":"3ae3c7c7-ea51-46de-9540-12f4110eac9b"}'

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:latest .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:latest

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
          containerAppEnvironment: cae-evangelista
          ingress: external
          targetPort: 8000
          arguments: |
            --env-vars LLM_PROVIDER=openai_generic LLM_MODEL=gemma-local LOCAL_LLM_URL=http://app-evangelista-llm.internal.jollyflower-774ba306.eastus2.azurecontainerapps.io/v1 DATABASE_URL="postgresql://evangelista_admin:Evangelista.Pass7990*@pg-evangelista-7990.postgres.database.azure.com:5432/db_evangelista?sslmode=require" ASYNC_DATABASE_URL="postgresql+asyncpg://evangelista_admin:Evangelista.Pass7990*@pg-evangelista-7990.postgres.database.azure.com:5432/db_evangelista?sslmode=require" QDRANT_MODE=server QDRANT_HOST=app-evangelista-qdrant.internal.jollyflower-774ba306.eastus2.azurecontainerapps.io QDRANT_PORT=80
