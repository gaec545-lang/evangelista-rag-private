[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evangelista-rag"
version = "0.1.0"
description = "Evangelista Intelligence Platform - RAG & Agents"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
